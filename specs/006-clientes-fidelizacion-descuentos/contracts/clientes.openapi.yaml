openapi: 3.1.0
info: { title: "CRONOS — Clientes y Fidelización (006)", version: "0.1.0" }
servers: [{ url: http://localhost:8000 }]
security: [{ bearerAuth: [] }]
paths:
  /clientes:
    get:
      operationId: listClientes
      description: Búsqueda multi-criterio (nombre, cédula/RUC, email, teléfono, número de afiliado). Paginado.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: nivel_id, in: query, schema: { type: integer } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses: { "200": { description: Página de clientes } }
    post:
      operationId: createCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, identificacion, nombre, consentimiento]
              properties:
                tipo: { type: string, enum: [natural, juridica] }
                identificacion: { type: string }
                nombre: { type: string }
                email: { type: string }
                telefono: { type: string }
                direccion: { type: string }
                fecha_nacimiento: { type: string, format: date, nullable: true }
                preferencias: { type: object }
                consentimiento:
                  type: object
                  required: [aceptado, version_texto]
                  properties: { aceptado: { type: boolean }, version_texto: { type: integer } }
      responses:
        "201": { description: Cliente creado con numero_afiliado }
        "409": { description: Identificación duplicada }
        "422": { description: Consentimiento no aceptado }
  /clientes/{id}:
    get: { operationId: getCliente, parameters: [{ name: id, in: path, required: true, schema: { type: integer } }], responses: { "200": { description: Ficha + nivel + cupones activos } } }
    patch:
      operationId: updateCliente
      description: identificacion solo con rol elevado. Auditado.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Actualizado }, "403": { description: identificacion requiere rol elevado } }
  /clientes/{id}/historial:
    get:
      operationId: getHistorialCliente
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Compras, servicios y citas del cliente } }
  /niveles:
    get: { operationId: listNiveles, responses: { "200": { description: Niveles con reglas y beneficios } } }
    post: { operationId: createNivel, responses: { "201": { description: Nivel + regla creados } } }
  /niveles/{id}/regla:
    put:
      operationId: setReglaNivel
      description: Cambiar umbrales dispara recálculo masivo diferido. Auditado.
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Regla actualizada; recálculo encolado } }
  /reportes/clientes-por-nivel:
    get: { operationId: reporteClientesPorNivel, responses: { "200": { description: Distribución por nivel (exportable) } } }
  /reportes/mejores-clientes:
    get:
      operationId: reporteMejoresClientes
      parameters: [{ name: top, in: query, schema: { type: integer, default: 20 } }, { name: desde, in: query, schema: { type: string, format: date } }]
      responses: { "200": { description: Top por Σ compras + servicios } }
  /_internal/fidelizacion/recalcular:
    post:
      operationId: recalcularNivelCliente
      description: Invocado por 008 (servicio) y 009 (venta) al confirmar.
      requestBody: { content: { application/json: { schema: { type: object, required: [cliente_id, hecho], properties: { cliente_id: { type: integer }, hecho: { type: string, enum: [venta, servicio] }, documento_id: { type: integer } } } } } }
      responses: { "200": { description: "{ nivel_anterior, nivel_nuevo, cambio: bool }" } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
