<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Los clientes que soportan @font-face (Apple Mail, etc.) usan la tipografía
       del sistema CRONOS; el resto degrada a la pila web-safe de respaldo. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Hanken+Grotesk:wght@400;600&display=swap" />
</head>
<body style="margin:0;padding:0;background-color:#EFEBE0;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EFEBE0;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#FFFFFF;border:1px solid #E0D7C3;border-radius:14px;overflow:hidden;">
        <tr><td style="background-color:#0F172A;padding:20px 28px;">
          <span style="font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:3px;color:#F6F7FA;">CRONOS</span>
        </td></tr>
        <tr><td style="height:2px;background-color:#6B5320;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td style="padding:32px 28px;font-family:'Hanken Grotesk',Georgia,'Segoe UI',sans-serif;font-size:15px;line-height:1.6;color:#22252B;">
          <h1 style="margin:0 0 16px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px;line-height:1.15;color:#17191E;">{% block titulo %}{% endblock %}</h1>
          {% block cuerpo %}{% endblock %}
        </td></tr>
        <tr><td style="padding:20px 28px;border-top:1px solid #E0D7C3;font-family:'Hanken Grotesk',Georgia,'Segoe UI',sans-serif;font-size:12px;color:#8B909A;">
          Sistema de gestión CRONOS · Relojería de alta gama. Este es un mensaje automático; no respondas a este correo.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
