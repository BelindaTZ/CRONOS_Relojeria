[project]
name = "cronos-backend"
version = "0.1.0"
description = "CRONOS — backend FastAPI (bootstrap de infraestructura, feature 000)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.15",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "minio>=7.2,<8.0",
    "bcrypt>=4.2,<5.0",
    "pyjwt>=2.9,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.12,<0.1",
    "apscheduler>=3.10,<4.0",
    "reportlab>=4.2,<5.0",
    "httpx>=0.27,<0.29",
    # feature 012: cliente del warehouse analítico, import perezoso (nunca al
    # arrancar) — reportes_estado/service.py.
    "clickhouse-connect>=0.7,<0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
